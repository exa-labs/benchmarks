[project]
name = "webcode-benchmark"
version = "0.1.0"
description = "Code search and extraction benchmarks for evaluating search providers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Exa", email = "hello@exa.ai" }]
keywords = ["benchmark", "search", "code", "evaluation", "llm", "rag", "extraction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = ["harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0", "ruff>=0.1.0"]

[tool.uv.sources]
harness = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evals"]

[tool.hatch.build.targets.wheel.force-include]
"data/e2e/code_e2e.jsonl" = "evals/data/e2e/code_e2e.jsonl"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
