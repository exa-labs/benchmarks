[project]
name = "harness"
version = "0.1.0"
description = "Open evaluation harness for web search APIs and search agents"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Exa", email = "hello@exa.ai" }]
dependencies = [
    "shared",
    "anthropic>=0.69.0",
    "datasets>=3.0.0",
    "dateparser>=1.2.0",
    "httpx>=0.27.0",
    "huggingface-hub>=0.30.0",
    "openai>=2.0.0",
    "pandas>=2.2.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.scripts]
bench = "harness.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
