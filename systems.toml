# Task-specific extraction/search settings used by legacy entry points.
[searchers.exa-people]
provider = "exa"
category = "people"
[searchers.exa-company]
provider = "exa"
category = "company"
[searchers.exa-publication]
provider = "exa"
category = "publication"
include_text = true
[searchers.brave-people]
provider = "brave"
site_filter = "linkedin.com/in"
[searchers.parallel-people]
provider = "parallel"
source_policy = { include_domains = ["linkedin.com"] }
[searchers.exa-webcode]
provider = "exa"
type = "fast"
max_age_hours = 0
[searchers.exa-extract]
provider = "exa"
extract_mode = "highlights"
max_characters = 4000
max_age_hours = 0
[searchers.parallel-extract]
provider = "parallel"
excerpt_max_chars = 4000
[searchers.claude-extract]
provider = "claude"
tool_version = "web_fetch_20260209"
model = "claude-sonnet-4-6"

[systems.search-exa-people]
kind = "search"
searcher = "exa-people"

[systems.search-exa-company]
kind = "search"
searcher = "exa-company"

[systems.search-exa-publication]
kind = "search"
searcher = "exa-publication"

[systems.search-brave-people]
kind = "search"
searcher = "brave-people"

[systems.search-parallel-people]
kind = "search"
searcher = "parallel-people"

[systems.rag-exa-company]
kind = "rag"
searcher = "exa-company"

[systems.rag-exa-webcode]
kind = "rag"
searcher = "exa-webcode"

[systems.extract-rag-exa-extract]
kind = "extract-rag"
searcher = "exa-extract"

[systems.extract-rag-parallel-extract]
kind = "extract-rag"
searcher = "parallel-extract"

[systems.extract-rag-claude-extract]
kind = "extract-rag"
searcher = "claude-extract"
