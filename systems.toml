# Search backends and shared execution defaults. Provider options live here once.

[defaults.scout]
model = "openai/gpt-5.6-luna"
reasoning_effort = "medium"
max_output_tokens = 32000
max_rounds = 25
max_no_tool_nudges = 3
timeout_s = 3600
num_results = 10

[defaults.rag]
model = "openai/gpt-5.6-luna"
num_results = 10

[defaults.search]
num_results = 10

[defaults.extract-rag]
model = "openai/gpt-5.6-luna"
num_results = 1

[searchers.exa-instant-highlights]
provider = "exa"
type = "instant"
contents = { highlights = true }

[searchers.exa-fast-highlights]
provider = "exa"
type = "fast"
contents = { highlights = true }

[searchers.exa-auto-highlights]
provider = "exa"
type = "auto"
contents = { highlights = true }

[searchers.perplexity-web]
provider = "perplexity"
search_type = "web"

[searchers.perplexity-fast]
provider = "perplexity"
search_type = "fast"

[searchers.parallel-turbo]
provider = "parallel"
mode = "turbo"

[searchers.parallel-fast]
provider = "parallel"
mode = "fast"

[searchers.parallel-basic]
provider = "parallel"
mode = "basic"

[searchers.parallel-advanced]
provider = "parallel"
mode = "advanced"

[searchers.brave-llm-context]
provider = "brave"

[systems.scout-exa-instant-highlights]
kind = "scout"
searcher = "exa-instant-highlights"

[systems.rag-exa-instant-highlights]
kind = "rag"
searcher = "exa-instant-highlights"

[systems.search-exa-instant-highlights]
