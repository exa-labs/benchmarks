# Systems catalog for the evaluation harness.
#
# A *searcher* is one provider endpoint with fixed request settings. A *system* is
# what gets evaluated:
#   kind = "scout"  — the Scout research loop: a model plus either a searcher
#                     (caller-owned search tool) or the model provider's own
#                     hosted web search (`hosted_web_search`).
#   kind = "rag"    — single-step RAG: one search, one tools-free synthesis.
#
# Scout systems share every setting in [defaults.scout] and differ only in their
# search backend, so their scores are comparable. Override the model of any scout
# or rag system at run time with `bench run --model <provider>/<model>`.

# --- Search backends ------------------------------------------------------------

[searchers.exa-auto]
provider = "exa"
type = "auto"
contents = { highlights = true }

[searchers.exa-fast]
provider = "exa"
type = "fast"
contents = { highlights = true }

[searchers.exa-instant]
provider = "exa"
type = "instant"
contents = { highlights = true }

[searchers.brave-llm-context]
provider = "brave"
search_type = "llm_context"

[searchers.brave-web]
provider = "brave"
search_type = "web"

[searchers.parallel-advanced]
provider = "parallel"
mode = "advanced"

[searchers.parallel-basic]
provider = "parallel"
mode = "basic"

[searchers.parallel-fast]
provider = "parallel"
mode = "fast"

[searchers.parallel-turbo]
provider = "parallel"
mode = "turbo"

[searchers.perplexity]
provider = "perplexity"
search_type = "web"

[searchers.perplexity-fast]
provider = "perplexity"
search_type = "fast"

# --- Shared defaults ---------------------------------------------------------------

[defaults.scout]
model = "openai/gpt-5.6-luna"
reasoning_effort = "medium"
max_output_tokens = 32000
max_rounds = 25
max_no_tool_nudges = 3
timeout_s = 3600
num_results = 10

[defaults.rag]
model = "openai/gpt-5.6-luna"
num_results = 10

# --- Scout over single-step search APIs ----------------------------------------------

[systems.scout-exa-auto]
kind = "scout"
searcher = "exa-auto"

[systems.scout-exa-fast]
kind = "scout"
searcher = "exa-fast"

[systems.scout-exa-instant]
kind = "scout"
searcher = "exa-instant"

[systems.scout-brave]
kind = "scout"
searcher = "brave-llm-context"

[systems.scout-parallel-advanced]
kind = "scout"
searcher = "parallel-advanced"

[systems.scout-parallel-fast]
kind = "scout"
searcher = "parallel-fast"

[systems.scout-perplexity]
kind = "scout"
searcher = "perplexity"

# --- Scout over provider-hosted web search -------------------------------------------

[systems.openai-native-search]
kind = "scout"
model = "openai/gpt-5.6-terra"
hosted_web_search = {}

[systems.openai-native-search-luna]
kind = "scout"
model = "openai/gpt-5.6-luna"
hosted_web_search = {}

[systems.anthropic-native-search]
kind = "scout"
model = "anthropic/claude-sonnet-5"
hosted_web_search = { max_uses = 15 }

# --- Single-step RAG baselines ---------------------------------------------------------

[systems.rag-exa-auto]
kind = "rag"
searcher = "exa-auto"

[systems.rag-exa-fast]
kind = "rag"
searcher = "exa-fast"

[systems.rag-brave]
kind = "rag"
searcher = "brave-llm-context"

[systems.rag-parallel-advanced]
kind = "rag"
searcher = "parallel-advanced"

[systems.rag-perplexity]
kind = "rag"
searcher = "perplexity"
